{% comment %}Shared search/filter form. Expects filter_form.{% endcomment %}
<form method="get" class="filters">
    <p class="filters__title">Filter appointments</p>
    <div class="filters__grid">
        {% for field in filter_form %}
            {% include "partials/_field.html" with field=field %}
        {% endfor %}
    </div>
    <div class="filters__actions">
        <button type="submit" class="btn btn--primary">Apply filters</button>
        <a class="btn btn--secondary" href="{{ request.path }}">Reset</a>
    </div>
</form>
