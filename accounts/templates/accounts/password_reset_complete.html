{% extends "base.html" %}

{% block title %}Password changed — Care_Clinic{% endblock %}

{% block content %}
<div class="container container--form">
    <section class="auth-panel" aria-labelledby="reset-complete-heading">
        <span class="section-rule" aria-hidden="true"></span>
        <h1 id="reset-complete-heading">Password changed</h1>
        <p>Your password has been set. You can now log in with your new password.</p>
        <div class="auth-actions"><a class="btn btn--primary btn--block" href="{% url 'accounts:login' %}">Log in</a></div>
    </section>
</div>
{% endblock %}
