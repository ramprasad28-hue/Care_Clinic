{% extends "base.html" %}

{% block title %}Logged out — Care_Clinic{% endblock %}

{% block content %}
<div class="container container--form">
    <section class="auth-panel" aria-labelledby="logged-out-heading">
        <span class="section-rule" aria-hidden="true"></span>
        <h1 id="logged-out-heading">You have been logged out</h1>
        <p>Thanks for visiting Care_Clinic. Your session has ended on this device.</p>
        <div class="auth-actions"><a class="btn btn--primary btn--block" href="{% url 'accounts:login' %}">Log in again</a></div>
    </section>
</div>
{% endblock %}
