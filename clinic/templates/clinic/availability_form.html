{% extends "base.html" %}

{% block title %}Availability rule — Care_Clinic{% endblock %}

{% block content %}
<h1>{% if form.instance.pk %}Edit availability rule{% else %}Add availability rule{% endif %}</h1>

<form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a class="btn btn-secondary" href="{% url 'clinic:availability_list' %}">Cancel</a>
</form>
{% endblock %}
