{% extends "base.html" %}

{% block title %}Delete leave — Care_Clinic{% endblock %}

{% block content %}
<h1>Delete leave</h1>
<p>Delete the leave from {{ object.start_date }} to {{ object.end_date }}?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-primary">Delete</button>
    <a class="btn btn-secondary" href="{% url 'clinic:leave_list' %}">Cancel</a>
</form>
{% endblock %}
