{% extends "base.html" %}

{% block title %}Add leave — Care_Clinic{% endblock %}

{% block content %}
<h1>Add leave</h1>

<form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a class="btn btn-secondary" href="{% url 'clinic:leave_list' %}">Cancel</a>
</form>
{% endblock %}
