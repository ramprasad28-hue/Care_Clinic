name: Security & tests

# Automated application tests, Django deployment checks, static security
# analysis and dependency auditing (Phase 8 step 9).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------
  # Job 1 — static security analysis + dependency vulnerability audit
  # (least privilege, no deployment, no credentials)
  # -------------------------------------------------------------------
  security-audit:
    name: Security audit (bandit + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install MySQL driver build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Static security analysis (bandit) — failures fail the job
        run: bandit -ll -r accounts clinic appointments dashboards website config

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt

  # -------------------------------------------------------------------
  # Job 2 — full Django verification against a disposable MySQL 8 service
  # (no production credentials, no deployment, no external services)
  # -------------------------------------------------------------------
  django-tests:
    name: Django suite on MySQL 8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Disposable CI-only MySQL 8 service. The credentials below are
    # synthetic disposable values for this ephemeral container only and
    # are never valid anywhere else (deliberately not production guidance).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: care_clinic
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_ENGINE: mysql
      DATABASE_NAME: care_clinic
      DATABASE_USER: root
      DATABASE_PASSWORD: ci-only-root-password
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"
      # Explicit dummy, non-secret values so the production-settings
      # configuration and deployment checks run without any real secret
      # present in the pipeline (or any checkout of a .env file).
      DJANGO_SECRET_KEY: dummy-secret-not-for-real-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install mysqlclient build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Django system check
        run: python manage.py check

      - name: Migration consistency check
        run: python manage.py makemigrations --check --dry-run

      - name: Production deployment check (dummy CI-only values)
        run: python manage.py check --deploy --settings=config.settings.production

      - name: Verify the database backend is MySQL before running tests
        run: |
          python manage.py shell -c "from django.db import connection; vendor = connection.vendor; print('database vendor:', vendor); assert vendor == 'mysql', 'unexpected database vendor: ' + vendor"

      - name: Focused MySQL concurrency test (row locking must be exercised)
        run: python manage.py test appointments.tests.BookingConcurrencyTests.test_concurrent_booking_has_single_winner --keepdb -v 2

      - name: Full test suite on MySQL
        run: python manage.py test --keepdb -v 2
